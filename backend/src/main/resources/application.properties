spring.application.name=cuidadores-api
server.port=8080

# Conexión a tu PostgreSQL local (sin Docker)
# Usa tus valores locales por defecto, pero permite que tus compañeras los sobreescriban con variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cuidadores_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1607}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# VULNERABILIDAD INTENCIONAL 5.3 (a): Secreto JWT débil y hardcodeado (CWE-798)
# Nota: Para HS256 en jjwt se requieren al menos 32 caracteres (256 bits), 
# pero usamos una clave predecible y expuesta en el repositorio.
# =========================================================================
jwt.secret=clave_secreta_super_debil_1234567890
jwt.expiration=86400000