spring.application.name=cuidadores-api
server.port=8080

# Conexión a tu PostgreSQL local (sin Docker)
# Usa tus valores locales por defecto, pero permite que tus compañeras los sobreescriban con variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cuidadores_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1607}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# MITIGACIÓN 5.3 (a): Secreto JWT externalizado y expiración acotada
# (CWE-798 / CWE-321 mitigados)
# El secreto criptográfico NO se almacena en el código fuente: debe definirse
# en la variable de entorno del sistema JWT_SECRET (mínimo 32 caracteres).
# La expiración se reduce de 24 horas a 30 minutos (1800000 ms).
# =========================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800000}